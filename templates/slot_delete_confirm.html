{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-lg">
    <h1 class="text-2xl font-bold mb-6">Удалить слот</h1>
    <div class="mb-4">Вы уверены, что хотите удалить слот <b>{{ slot.date }} {{ slot.start_time|time:'H:i' }}–{{ slot.end_time|time:'H:i' }}</b>?</div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded">Удалить</button>
        <a href="{% url 'my_slots' %}" class="ml-4 text-gray-600 hover:underline">Отмена</a>
    </form>
</div>
{% endblock %}
